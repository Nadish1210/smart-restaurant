name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ["win-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r desktop/requirements.txt

      - name: Build app with PyInstaller
        working-directory: desktop
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name SmartRestaurant --icon assets/icon.ico
          --add-data "assets;assets" app.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        working-directory: desktop
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: SmartRestaurant_Setup
          path: desktop/Output/SmartRestaurant_Setup.exe

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: Windows installer #${{ github.run_number }}
          files: desktop/Output/SmartRestaurant_Setup.exe
