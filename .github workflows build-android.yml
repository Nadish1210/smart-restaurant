name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk SmartRestaurant.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SmartRestaurant-apk
          path: SmartRestaurant.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Android APK #${{ github.run_number }}
          files: SmartRestaurant.apk
